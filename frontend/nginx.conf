# SPA + proxy da API na mesma origem (cookie de sessão e CSRF sem CORS; ver docs/adr/0002).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome: podem ficar em cache indefinidamente.
    location /assets/ {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Rotas do SPA caem no index.html, que nunca deve ficar em cache.
    location / {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
